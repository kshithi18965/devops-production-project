replicaCount: 1

image:
  repository: ghcr.io/kshithi18965/devops-production-project
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 5000

probes:
  path: /health
  initialDelaySeconds: 5
  periodSeconds: 10

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi
