name: Publish image & Deploy to staging

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write
  id-token: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/devops-production-project

jobs:
  test:
    name: CI — PR checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Lint (optional, non-blocking)
        run: |
          if command -v flake8 >/dev/null 2>&1; then flake8 || true; fi

      - name: Unit tests
        run: |
          if command -v pytest >/dev/null 2>&1; then pytest -q || exit 1; fi

      - name: Dependency scan (safety)
        run: |
          pip install --user safety >/dev/null 2>&1 || true
          if command -v safety >/dev/null 2>&1; then safety check --bare || true; fi

      - name: Container build (verify will build, no push)
        uses: docker/setup-buildx-action@v3
      - name: Build verify (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: temp-check:${{ github.sha }}
          platforms: linux/amd64

  build-and-push:
    name: publish-and-push
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set tag to full SHA
        id: set_tag
        run: echo "tag=${GITHUB_SHA}" >> $GITHUB_OUTPUT

      - name: Build and push image to GHCR
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.set_tag.outputs.tag }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache,mode=max
          platforms: linux/amd64,linux/arm64

  deploy-staging:
    name: deploy-staging
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup kubeconfig
        env:
          KUBE_CONFIG_STAGING: ${{ secrets.KUBE_CONFIG_STAGING }}
        run: |
          echo "$KUBE_CONFIG_STAGING" > /tmp/kubeconfig
          export KUBECONFIG=/tmp/kubeconfig
          kubectl version --client

      - name: Deploy to staging (use sha tagged image)
        run: |
          IMAGE=${{ env.IMAGE_NAME }}:${{ steps.set_tag.outputs.tag }}
          kubectl -n staging set image deployment/myapp myapp=$IMAGE --record || true
          kubectl rollout status deployment/myapp -n staging --timeout=120s || true
