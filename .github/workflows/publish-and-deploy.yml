name: Publish image & Deploy to staging

on:
  push:
    branches:
      - main
    paths:
      - "Dockerfile"
      - "main.py"
      - "requirements.txt"
      - "src/**"
      - ".github/workflows/publish-and-deploy.yml"

permissions:
  contents: read
  packages: write
  id-token: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/devops-production-project

jobs:

  # -------------------------
  # 1. TEST + QUALITY + SECURITY
  # -------------------------
  test:
    name: CI — checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt || true
          pip install pytest flake8 bandit

      - name: Lint (strict)
        run: |
          flake8 . || exit 1

      - name: Security scan (bandit)
        run: |
          bandit -r . -ll || true

      - name: Run tests
        run: |
          PYTHONPATH=. pytest -v

  # -------------------------
  # 2. BUILD (NO PUSH)
  # -------------------------
  build:
    name: Build image (no push)
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: temp:${{ github.sha }}

  # -------------------------
  # 3. SECURITY SCAN (TRIVY - FIXED)
  # -------------------------
  scan:
    name: Security scan (Trivy FS)
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # ✅ Scan source code instead of image (FAST + RELIABLE)
      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.20.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1

  # -------------------------
  # 4. BUILD & PUSH (GHCR)
  # -------------------------
  build-and-push:
    name: Publish to GHCR
    needs: scan
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tag
        id: meta
        run: echo "tag=${GITHUB_SHA}" >> $GITHUB_OUTPUT

      - uses: docker/setup-buildx-action@v3

      - name: Build & Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE_NAME }}:latest
          platforms: linux/amd64

  # -------------------------
  # 5. DEPLOY TO STAGING
  # -------------------------
  deploy-staging:
    name: Deploy to Staging
    needs: build-and-push
    runs-on: self-hosted
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to staging with Helm
        run: |
          helm upgrade --install shopapp helm/shopapp \
            -f helm/shopapp/values-staging.yaml \
            --namespace staging \
            --set image.tag=${{ needs.build-and-push.outputs.image_tag }} \
            --wait --timeout 120s

  # -------------------------
  # 6. DEPLOY TO PRODUCTION
  # -------------------------
  deploy-production:
    name: Deploy to Production
    needs: [build-and-push, deploy-staging]
    runs-on: self-hosted
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to production with Helm
        run: |
          helm upgrade --install shopapp helm/shopapp \
            -f helm/shopapp/values-production.yaml \
            --namespace production \
            --set image.tag=${{ needs.build-and-push.outputs.image_tag }} \
            --wait --timeout 120s
