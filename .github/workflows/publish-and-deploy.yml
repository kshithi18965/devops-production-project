name: Publish image & Deploy to staging

on:
  push:
    branches:
      - main
    paths:
      - "Dockerfile"
      - "main.py"
      - "requirements.txt"
      - "src/**"
      - ".github/workflows/**"

permissions:
  contents: read
  packages: write
  id-token: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/devops-production-project

jobs:

  # -------------------------
  # 1. TEST
  # -------------------------
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - run: |
          pip install -r requirements.txt || true
          pip install pytest flake8 bandit

      - run: flake8 . || exit 1
      - run: bandit -r . -ll || true
      - run: PYTHONPATH=. pytest -v

  # -------------------------
  # 2. BUILD IMAGE
  # -------------------------
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build image
        run: docker build -t temp:${{ github.sha }} .

  # -------------------------
  # 3. SCAN IMAGE (FIXED)
  # -------------------------
  scan:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Scan with Trivy
        uses: aquasecurity/trivy-action@v0.20.0
        with:
          image-ref: temp:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          vuln-type: os,library
          exit-code: 1

  # -------------------------
  # 4. PUSH IMAGE
  # -------------------------
  build-and-push:
    needs: scan
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag
        id: meta
        run: echo "tag=${GITHUB_SHA}" >> $GITHUB_OUTPUT

      - uses: docker/setup-buildx-action@v3

      - name: Build & Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE_NAME }}:latest

  # -------------------------
  # 5. DEPLOY
  # -------------------------
  deploy-staging:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - name: Setup kubeconfig
        env:
          KUBE_CONFIG_STAGING: ${{ secrets.KUBE_CONFIG_STAGING }}
        run: |
          if [ -z "$KUBE_CONFIG_STAGING" ]; then
            echo "No kubeconfig → skipping deploy"
            exit 0
          fi

          echo "$KUBE_CONFIG_STAGING" > kubeconfig
          export KUBECONFIG=$PWD/kubeconfig

      - name: Deploy
        run: |
          IMAGE=${{ env.IMAGE_NAME }}:${{ needs.build-and-push.outputs.image_tag }}

          kubectl -n staging set image deployment/myapp myapp=$IMAGE --record || true
          kubectl rollout status deployment/myapp -n staging --timeout=120s || true
