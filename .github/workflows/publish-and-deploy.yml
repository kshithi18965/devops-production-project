name: Publish image & Deploy to staging

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write
  id-token: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/devops-production-project

jobs:
  test:
    name: CI — PR checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt || true
          pip install pytest flake8 bandit safety

      - name: Lint
        run: flake8 . || exit 1

      - name: Security scan (bandit)
        run: bandit -r . -ll || true

      - name: Dependency scan
        run: safety scan || true

      - name: Run tests
        run: PYTHONPATH=. pytest -v

      - name: Docker build test
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: test-image:${{ github.sha }}

  build-scan-push:
    name: docker-build-scan-push
    needs: test
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tag
        id: meta
        run: echo "tag=${GITHUB_SHA}" >> $GITHUB_OUTPUT

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ✅ Build locally (no push)
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: temp-image:${{ steps.meta.outputs.tag }}

      # ✅ 🔐 Trivy scan (BLOCK if high/critical)
      - name: Scan Docker image
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: temp-image:${{ steps.meta.outputs.tag }}
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH

      # ✅ Push only if scan passes
      - name: Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE_NAME }}:latest

  deploy-staging:
    name: deploy-staging
    needs: build-scan-push
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup kubeconfig
        env:
          KUBE_CONFIG_STAGING: ${{ secrets.KUBE_CONFIG_STAGING }}
        run: |
          if [ -z "$KUBE_CONFIG_STAGING" ]; then
            echo "No kubeconfig → skipping deploy safely"
            exit 0
          fi

          echo "$KUBE_CONFIG_STAGING" > kubeconfig
          export KUBECONFIG=$PWD/kubeconfig
          kubectl version --client

      - name: Deploy to staging
        run: |
          IMAGE=${{ env.IMAGE_NAME }}:${{ needs.build-scan-push.outputs.image_tag }}
          echo "Deploying image: $IMAGE"

          kubectl -n staging set image deployment/myapp myapp=$IMAGE --record || true
          kubectl rollout status deployment/myapp -n staging --timeout=120s || true
