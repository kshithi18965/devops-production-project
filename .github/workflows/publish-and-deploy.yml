name: Publish image & Deploy to staging

on:
  push:
    branches:
      - main
    paths:
      - "Dockerfile"
      - "main.py"
      - "requirements.txt"
      - "src/**"
      - ".github/workflows/**"

permissions:
  contents: read
  packages: write
  id-token: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/devops-production-project

jobs:

  test:
    name: CI — PR checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          pip install -r requirements.txt || true
          pip install pytest flake8 bandit

      - name: Lint
        run: flake8 . || exit 1

      - name: Security scan (bandit)
        run: bandit -r . -ll || true

      - name: Run tests
        run: PYTHONPATH=. pytest -v


  build:
    name: Build image (no push)
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: temp:${{ github.sha }}


  scan:
    name: Docker security scan (Trivy)
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build image locally for scan
        run: |
          docker build -t temp:${{ github.sha }} .

      - name: Run Trivy scan
        uses: aquasecurity/trivy-action@v0.20.0
        with:
          image-ref: temp:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: 1


  build-and-push:
    name: publish-and-push
    needs: scan
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set tag
        id: meta
        run: echo "tag=${GITHUB_SHA}" >> $GITHUB_OUTPUT

      - uses: docker/setup-buildx-action@v3

      - name: Build & push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE_NAME }}:latest
          platforms: linux/amd64


  deploy-staging:
    name: deploy-staging
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - name: Setup kubeconfig
        env:
          KUBE_CONFIG_STAGING: ${{ secrets.KUBE_CONFIG_STAGING }}
        run: |
          if [ -z "$KUBE_CONFIG_STAGING" ]; then
            echo "No kubeconfig → skipping deploy"
            exit 0
          fi

          echo "$KUBE_CONFIG_STAGING" > kubeconfig
          export KUBECONFIG=$PWD/kubeconfig
          kubectl version --client

      - name: Deploy
        run: |
          IMAGE=${{ env.IMAGE_NAME }}:${{ needs.build-and-push.outputs.image_tag }}
          kubectl -n staging set image deployment/myapp myapp=$IMAGE --record || true
          kubectl rollout status deployment/myapp -n staging --timeout=120s || true

