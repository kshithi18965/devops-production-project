name: CI — PR checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  quality-security-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt || true
          pip install pytest flake8 bandit safety

      - name: Lint check (flake8)
        run: |
          flake8 . || exit 1

      - name: Security scan (bandit)
        run: |
          bandit -r . -ll || true

      - name: Dependency scan (safety)
        run: |
          safety scan || true

      - name: Run tests
        run: |
          PYTHONPATH=. pytest -v
