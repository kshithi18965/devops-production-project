name: Manual Rollback

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to roll back"
        required: true
        type: choice
        options:
          - dev
          - qa
          - staging
          - production
      revision:
        description: "Revision number to roll back to (leave blank for previous revision)"
        required: false
        type: string

jobs:
  rollback:
    name: Rollback ${{ github.event.inputs.environment }}
    runs-on: self-hosted
    environment: ${{ github.event.inputs.environment }}

    steps:
      - uses: actions/checkout@v4

      - name: Roll back release
        run: |
          if [ -z "${{ github.event.inputs.revision }}" ]; then
            helm rollback shopapp -n ${{ github.event.inputs.environment }} --wait --timeout 120s
          else
            helm rollback shopapp ${{ github.event.inputs.revision }} -n ${{ github.event.inputs.environment }} --wait --timeout 120s
          fi

      - name: Verify rollout
        run: |
          kubectl rollout status deployment/shopapp -n ${{ github.event.inputs.environment }} --timeout=120s
